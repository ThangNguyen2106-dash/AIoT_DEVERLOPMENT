[platformio]
default_envs = esp32dev
src_dir = examples/00_Controller_Board_Demo

[env:esp32dev]
lib_deps = 
    symlink://.
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = direct
board_build.partitions = min_spiffs.csv
build_flags = 
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections

